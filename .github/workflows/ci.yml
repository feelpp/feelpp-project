name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:

  build_wheel:
    runs-on: self-${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    name: Build wheel package
    if: "!contains(github.event.head_commit.message, 'skip wheel')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python/Node Env
        run: |
          uv venv --system-site-packages
          source .venv/bin/activate
          uv pip install -r pyproject.toml --extra dev --extra test
          npm install --verbose
          npx downdoc README.adoc

      - name: Build wheel
        run: |
          source .venv/bin/activate
          pipx run build
          uv pip install dist/*.whl

      - name: Python Tests
        run: |
          source .venv/bin/activate

        env:
          PYTHONPATH: ${{ github.workspace }}
          GIRDER_API_KEY: ${{ secrets.GIRDER }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-wheel-${{ matrix.os }}
          path: dist/*.whl

  build_docs:
    needs: build_wheel
    runs-on: self-${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    name: Build & Deploy docs
    if: "!contains(github.event.head_commit.message, 'skip docs')"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          clean: true

      - name: Install credentials
        run: echo "https://$GITHUB_OAUTH:@github.com" > $HOME/.git-credentials
        env:
          GITHUB_OAUTH: ${{ secrets.CR_PAT_WORKFLOW }}

      - name: Download Wheels
        uses: actions/download-artifact@v6
        with:
          name: artifacts-wheel-${{ matrix.os }}
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: |
          uv venv --system-site-packages
          source .venv/bin/activate
          uv pip install dist/*.whl

      - name: Build Antora site
        run: |
          source .venv/bin/activate
          npm install --verbose
          npm run antora || true
          npm run antora
        env:
          GIRDER_API_KEY: ${{ secrets.GIRDER }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' && matrix.os == 'ubuntu-24.04'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: public

  build_code:
    needs: build_wheel
    runs-on: self-${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    name: Build & Test C++ (deb)
    if: "!contains(github.event.head_commit.message, 'skip build')"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          clean: true

      - name: Download Wheels
        uses: actions/download-artifact@v6
        with:
          name: artifacts-wheel-${{ matrix.os }}
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python & Node Env
        run: |
          uv venv --system-site-packages
          source .venv/bin/activate
          uv pip install -r pyproject.toml --extra test
          uv pip install dist/*.whl
          npm install --verbose
          npx downdoc README.adoc

      - name: Build C++ code
        run: |
          source .venv/bin/activate
          cmake --preset default
          cmake --build --preset default

      - name: Run CTest
        if: "!contains(github.event.head_commit.message, 'skip tests')"
        run: |
          source .venv/bin/activate
          ctest --preset default
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          GIRDER_API_KEY: ${{ secrets.GIRDER }}

      - name: Package .deb
        run: |
          cmake --build --preset default --target package

      - name: Checkout APT repository (scripts from main branch)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: feelpp/apt
          ref: main
          token: ${{ secrets.CR_PAT_WORKFLOW }}
          path: apt-scripts

      - name: Setup GPG
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        run: |
          # Configure GPG for non-interactive use
          export GPG_TTY=$(tty) || true
          export GNUPGHOME="$HOME/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          
          # Configure GPG agent for batch mode
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
          echo "use-agent" >> "$GNUPGHOME/gpg.conf"
          echo "batch" >> "$GNUPGHOME/gpg.conf"
          echo "no-tty" >> "$GNUPGHOME/gpg.conf"
          
          # Import the private key
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --no-tty --import
          
          # Get the fingerprint of the imported key and trust it
          FINGERPRINT=$(gpg --batch --no-tty --list-secret-keys --with-colons "${{ secrets.APT_GPG_KEY_ID }}" | awk -F: '/^fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            echo "${FINGERPRINT}:6:" | gpg --batch --no-tty --import-ownertrust
            echo "Trusted key with fingerprint: $FINGERPRINT"
          else
            echo "Warning: Could not find fingerprint for key ${{ secrets.APT_GPG_KEY_ID }}"
          fi

      - name: Configure git credentials for cross-repo push
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        env:
          APT_PUSH_TOKEN: ${{ secrets.CR_PAT_WORKFLOW }}
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global url."https://${APT_PUSH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Verify required tools
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        run: |
          set -e
          command -v rsync
          command -v gpg
          python3 --version
          
      - name: Determine channel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        id: channel
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "channel=testing" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "channel=pr" >> $GITHUB_OUTPUT
          else
            echo "channel=pr" >> $GITHUB_OUTPUT
          fi

      - name: Setup aptly and publish to APT repository
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'pull_request'
        uses: feelpp/setup-aptly@v1
        with:
          version: '1.6.2'
          cache: true
          publish: true
          component: feelpp-project
          distribution: noble
          channel: ${{ steps.channel.outputs.channel }}
          debs-path: build/default/assets
          pages-repo: https://github.com/feelpp/apt.git
          pages-branch: gh-pages
          apt-repo-path: apt-scripts
          gpg-key-id: ${{ secrets.APT_GPG_KEY_ID }}
          gpg-passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-deb-${{ matrix.os }}
          path: build/default/assets/feelpp-project-*

  docker:
    needs: build_code
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build container]')
    name: Build & Push Docker
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Determine channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "channel=testing" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "channel=pr" >> $GITHUB_OUTPUT
          else
            echo "channel=pr" >> $GITHUB_OUTPUT
          fi

      - name: Copy packages for Docker build
        run: |
          mkdir -p artifacts/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/feelpp/feelpp-project
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source="https://github.com/feelpp/feelpp-project"
            org.opencontainers.image.licenses="BSD-3-Clause"
            org.opencontainers.image.title="feelpp-project"
            org.opencontainers.image.description="Finite-element template project based on Feel++."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: artifacts
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_CHANNEL=${{ steps.channel.outputs.channel }}
            APT_COMPONENT=feelpp-project
          file: ./Dockerfile

  release:
    needs: [build_wheel, build_code]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/
          pattern: artifacts-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.whl
            artifacts/*.deb
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')}}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}